name: "💡 Feature Request"
description: "Предложить новую функцию или улучшение VRS.Details"
title: "[FEATURE] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Используйте эту форму для предложений по развитию VRS.Details.

        Опишите прежде всего задачу, которую должно решить улучшение, а не только желаемую кнопку или элемент интерфейса.

  - type: dropdown
    id: area
    attributes:
      label: "Раздел программы"
      description: "К какой части VRS.Details относится предложение?"
      options:
        - Главное окно / состав установки
        - Формирование Excel
        - Excel для KDXF Studio
        - Размещение горизонтальных стяжек
        - Расчёт крыши
        - КОМПАС-3D / создание чертежей
        - База данных
        - Обновление программы
        - Интерфейс
        - Новый модуль
        - Другое
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "Какую задачу нужно решить?"
      description: "Опишите существующую проблему, неудобство или ручную операцию."
      placeholder: |
        Например:
        Сейчас после расчёта приходится вручную переносить данные из программы в...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Предлагаемое решение"
      description: "Опишите, как вы предлагаете решить эту задачу."
      placeholder: |
        Например:
        Добавить кнопку, которая автоматически...
    validations:
      required: true

  - type: textarea
    id: workflow
    attributes:
      label: "Как это должно работать"
      description: "Если возможно, опишите предполагаемый порядок действий пользователя."
      placeholder: |
        1. Пользователь открывает...
        2. Выбирает...
        3. Нажимает...
        4. Программа автоматически...
    validations:
      required: false

  - type: textarea
    id: benefit
    attributes:
      label: "Какую пользу даст изменение?"
      description: "Например: уменьшит ручную работу, исключит ошибку, ускорит оформление КД."
      placeholder: "Опишите практический эффект."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Текущий обходной способ"
      description: "Как эта задача решается сейчас, если вообще решается?"
      placeholder: "Например: сейчас это приходится делать вручную в Excel."
    validations:
      required: false

  - type: textarea
    id: examples
    attributes:
      label: "Примеры, схемы или скриншоты"
      description: "Можно приложить изображения, эскизы интерфейса или примеры похожего решения."
      placeholder: "Перетащите материалы в это поле."
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: "Проверка перед отправкой"
      options:
        - label: "Я проверил существующие Issues и не нашёл аналогичного предложения."
          required: true
        - label: "Предложение относится к VRS.Details."
          required: true
